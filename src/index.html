<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>Ghostty</title>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, "PingFang SC", sans-serif;
        background: #fff;
      }
      #app {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        user-select: none;
        cursor: pointer;
      }
      .hint {
        color: #333;
        font-size: 14px;
        border: 1px solid #e5e5e5;
        border-radius: 8px;
        padding: 10px 18px;
        background: #fafafa;
      }
      .hint kbd {
        background: #eee;
        border-radius: 4px;
        padding: 1px 6px;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="hint">点击或按 <kbd>Enter</kbd> 打开 Ghostty</div>
    </div>
    <script src="preload.js"></script>
    <script>
      const GHOSTTY_APP = '/Applications/Ghostty.app'

      const openGhostty = () => {
        utools.shellOpenApp(GHOSTTY_APP)
        utools.hideMainWindow()
        utools.outPlugin()
      }

      utools.onPluginEnter(({ code }) => {
        // 进入插件，后续可按 code 区分不同关键字行为
      })

      document.getElementById('app').addEventListener('click', openGhostty)
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') openGhostty()
      })
    </script>
  </body>
</html>
